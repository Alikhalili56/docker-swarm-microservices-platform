---
# Domain & Certificates
domain_name: vcc.internal
cert_dir: /data/certs
cert_file_path: "{{ cert_dir }}/cert.pem"
cert_key_path: "{{ cert_dir }}/cert.key"

# Registry
registry_host: "registry.{{ domain_name }}"
registry_port: 5000
registry_url: "{{ registry_host }}:{{ registry_port }}"

# Database
postgres_user: postgres
dex_db_name: dexdb
dex_db_user: dex
forgejo_db_name: forgejodb
forgejo_db_user: forgejo
grafana_db_name: grafanadb
grafana_db_user: grafana

# Dex
dex_issuer: "https://auth.{{ domain_name }}"
dex_forgejo_client_id: forgejo
dex_grafana_client_id: grafana
dex_admin_email: "admin@example.com"
dex_admin_username: "admin"
