[DEFAULT]
APP_NAME = VCC Git
RUN_MODE = prod

[server]
PROTOCOL = http
ROOT_URL = https://git.{{ domain_name }}
DOMAIN = git.{{ domain_name }}
HTTP_PORT = 3200
SSH_PORT = 2222
LFS_START_SERVER = true
OFFLINE_MODE = true

[database]
DB_TYPE = postgres
HOST = postgres:5432
NAME = {{ forgejo_db_name }}
USER = {{ forgejo_db_user }}
PASSWD = {{ vault_forgejo_db_password }}
SSL_MODE = disable

[security]
INSTALL_LOCK = true
SECRET_KEY = {{ vault_forgejo_secret_key }}
INTERNAL_TOKEN = {{ vault_forgejo_internal_token }}

[metrics]
ENABLED = true

[session]
PROVIDER = db

[indexer]
REPO_INDEXER_ENABLED = true
