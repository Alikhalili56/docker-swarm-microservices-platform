networks:
  internal_net:
    driver: overlay

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
    networks:
      - internal_net
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - /data/configs/postgres/init:/docker-entrypoint-initdb.d:ro

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1-alpine
    user: root
    networks:
      - internal_net
    volumes:
      - /data/dex:/data
      - /data/configs/dex/dex.yaml:/etc/dex/config.docker.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.docker.yaml"]
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dex.rule=Host(`auth.{{ domain_name }}`)"
        - "traefik.http.routers.dex.entrypoints=websecure"
        - "traefik.http.routers.dex.tls=true"
        - "traefik.http.services.dex.loadbalancer.server.port=5556"

  traefik:
    # new Docker requires 1.44+, This prevented Traefik from discovering services via swarm provider (Dex unreachable)
    image: public.ecr.aws/docker/library/traefik:v3.6.2
    networks:
      internal_net:
        aliases:
          - auth.{{ domain_name }}
          - git.{{ domain_name }}
          - mon.{{ domain_name }}
          - prom.{{ domain_name }}
    command:
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
      - --log.format=json
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entryPoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=vcc_internal_net
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --providers.file.filename=/etc/traefik/tls.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - {{ cert_dir }}:/etc/certs:ro
      - /data/configs/traefik/tls.yml:/etc/traefik/tls.yml:ro
    deploy:
      placement:
        constraints: ["node.role == manager"]
      labels:
        - "traefik.enable=false"
        - "prometheus.io/scrape-me=yes-please"
        - "prometheus.io/metrics-port=8082"

  forgejo:
    image: {{ registry_url }}/forgejo:latest
    networks:
      - internal_net
    environment:
      - FORGEJO_DB_USER={{ forgejo_db_user }}
      - FORGEJO_DB_PASSWD={{ vault_forgejo_db_password }}
      - FORGEJO_DB_NAME={{ forgejo_db_name }}
      - FORGEJO_ADMIN_USER={{ forgejo_admin_user }}
      - FORGEJO_ADMIN_PASS={{ vault_forgejo_admin_pass }}
      - FORGEJO_ADMIN_EMAIL={{ forgejo_admin_email }}
      - DEX_CLIENT_ID={{ dex_forgejo_client_id }}
      - DEX_CLIENT_SECRET={{ vault_dex_forgejo_client_secret }}
    volumes:
      - /data/forgejo:/data
      - /data/configs/forgejo:/data/gitea/conf
      - {{ cert_dir }}:/etc/certs:ro
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.forgejo.rule=Host(`git.{{ domain_name }}`)"
        - "traefik.http.routers.forgejo.entrypoints=websecure"
        - "traefik.http.routers.forgejo.tls=true"
        - "traefik.http.services.forgejo.loadbalancer.server.port=3200"

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    hostname: "{% raw %}{{.Node.Hostname}}{% endraw %}"
    networks:
      - internal_net
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      mode: global

  prometheus:
    image: quay.io/prometheus/prometheus:v3.0.1
    user: root
    networks:
      - internal_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
    volumes:
      - /data/prometheus:/prometheus
      - /data/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      placement:
        constraints: ["node.role == manager"]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prom.{{ domain_name }}`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls=true"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: {{ registry_url }}/grafana:latest
    networks:
      - internal_net
    environment:
      - GF_SERVER_ROOT_URL=https://mon.{{ domain_name }}
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres:5432
      - GF_DATABASE_NAME={{ grafana_db_name }}
      - GF_DATABASE_USER={{ grafana_db_user }}
      - GF_DATABASE_PASSWORD={{ vault_grafana_db_password }}
      - GF_DATABASE_SSL_MODE=disable
      - GF_METRICS_ENABLED=true
      - GRAFANA_OAUTH_CLIENT_ID={{ dex_grafana_client_id }}
      - GRAFANA_OAUTH_CLIENT_SECRET={{ vault_dex_grafana_client_secret }}
    volumes:
      - {{ cert_dir }}:/etc/certs:ro
      - /data/configs/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`mon.{{ domain_name }}`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
