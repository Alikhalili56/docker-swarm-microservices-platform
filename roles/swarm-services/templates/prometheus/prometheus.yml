global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Docker Swarm service discovery - auto-discovers services with labels
  - job_name: docker_swarm_discovery
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      # only keep running containers
      - source_labels: ['__meta_dockerswarm_task_desired_state']
        regex: running
        action: keep
      # only keep containers with prometheus.io/scrape-me=yes-please label
      - source_labels: ['__meta_dockerswarm_service_label_prometheus_io_scrape_me']
        regex: yes-please
        action: keep
      # replace port from prometheus.io/metrics-port label
      - source_labels: ['__address__', '__meta_dockerswarm_service_label_prometheus_io_metrics_port']
        separator: ';'
        regex: '(.+)[:][0-9]+;(.+)$'
        replacement: '$1:$2'
        target_label: '__address__'
        action: replace
      # grab service name as label
      - source_labels: ['__meta_dockerswarm_service_name']
        target_label: service_name
        action: replace
      # grab node hostname as label
      - source_labels: ['__meta_dockerswarm_node_hostname']
        target_label: node
        action: replace
      # copy container labels from docker
      - regex: __meta_dockerswarm_container_label_(.+)
        replacement: swarm_container_label_$1
        action: labelmap
      # copy service labels from docker
      - regex: __meta_dockerswarm_service_label_(.+)
        replacement: swarm_service_label_$1
        action: labelmap

  # Node Exporter - use swarm discovery to get hostname
  - job_name: node-exporter
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: ['__meta_dockerswarm_task_desired_state']
        regex: running
        action: keep
      - source_labels: ['__meta_dockerswarm_service_name']
        regex: vcc_node-exporter
        action: keep
      - source_labels: ['__address__']
        regex: '(.+):[0-9]+'
        replacement: '$1:9100'
        target_label: '__address__'
      - source_labels: ['__meta_dockerswarm_node_hostname']
        target_label: instance
        action: replace

  # Registry - runs on host network on all nodes
  - job_name: registry
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: __address__
        replacement: '${1}:5001'
