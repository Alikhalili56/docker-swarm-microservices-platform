---
- name: Copy docker-compose files to remote host
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/opt/{{ item }}"
  loop: "{{ stack_file_names }}"

- name: Undeploy stack
  community.docker.docker_stack:
    state: absent
    name: vcc
    detach: false
  when: stack_recreate

- name: Install rsync
  ansible.builtin.apt:
    name:
      - rsync

- name: Delete directories in /data
  ansible.builtin.file:
    path: "/data/{{ item }}"
    state: absent
  loop: "{{ stack_data_directories }}"
  when: stack_nuke_data_directories

- name: Create directories in /data
  ansible.builtin.file:
    path: "/data/{{ item }}"
    state: directory
  loop: "{{ stack_data_directories }}"

- name: Set forgejo data directory ownership
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    recurse: true
  loop:
    - /data/forgejo
    - /data/forgejo/gitea
    - /data/forgejo/gitea/data

- name: Create /data/configs
  ansible.builtin.file:
    path: /data/configs
    state: directory

- name: Copy configs
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/configs/"
    dest: "/data/configs/"
    archive: true
    delete: true

- name: Create postgres init directory
  ansible.builtin.file:
    path: /data/configs/postgres/init
    state: directory

- name: Copy postgres init script
  ansible.builtin.template:
    src: postgres/001-init.sql
    dest: /data/configs/postgres/init/001-init.sql

- name: Create dex config directory
  ansible.builtin.file:
    path: /data/configs/dex
    state: directory

- name: Copy dex config
  ansible.builtin.template:
    src: dex/dex.yaml
    dest: /data/configs/dex/dex.yaml

- name: Create forgejo config directory
  ansible.builtin.file:
    path: /data/configs/forgejo
    state: directory
    owner: "1000"
    group: "1000"

- name: Copy forgejo config
  ansible.builtin.template:
    src: forgejo/forgejo.ini
    dest: /data/configs/forgejo/app.ini
    owner: "1000"
    group: "1000"

- name: Create prometheus config directory
  ansible.builtin.file:
    path: /data/configs/prometheus
    state: directory

- name: Copy prometheus config
  ansible.builtin.template:
    src: prometheus/prometheus.yml
    dest: /data/configs/prometheus/prometheus.yml

- name: Set prometheus data directory ownership
  ansible.builtin.file:
    path: /data/prometheus
    owner: "65534"
    group: "65534"

- name: Create grafana provisioning directories
  ansible.builtin.file:
    path: "/data/configs/grafana/provisioning/{{ item }}"
    state: directory
  loop:
    - datasources
    - dashboards

- name: Copy grafana datasources
  ansible.builtin.template:
    src: grafana/datasources.yml
    dest: /data/configs/grafana/provisioning/datasources/datasources.yml

- name: Copy grafana dashboard provisioning
  ansible.builtin.copy:
    src: grafana/dashboards.yml
    dest: /data/configs/grafana/provisioning/dashboards/dashboards.yml

- name: Copy grafana dashboards
  ansible.builtin.copy:
    src: "grafana/dashboards/"
    dest: /data/configs/grafana/provisioning/dashboards/

- name: Deploy stack from a compose file
  community.docker.docker_stack:
    state: present
    name: vcc
    prune: true
    detach: false
    with_registry_auth: true
    compose: "{{ ['/opt/'] | product(stack_file_names) | map('join') | list }}" # this is evil
  # retry the task that may fail
  retries: 3
  delay: 1
  register: result
  until: result is not failed
